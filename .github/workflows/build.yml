name: Build store app

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: store_app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  worker-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  # السيرفر (Cloudflare Worker) ينشر من master بس، أو يدوياً من زر Run workflow.
  deploy-worker:
    needs: worker-test
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # نتأكد من شكل الأسرار قبل ما نعطيها لـ wrangler، لأن إذا انحط سر بمكان غلط
      # رسائل الخطأ ممكن تطبع جزء منه بالسجل.
      - name: Check server secrets
        id: check
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping server deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/check-server-secrets.py
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Deploy server
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4'
          secrets: |
            BOT_TOKEN
            CHAT_ID
            FIREBASE_SERVICE_ACCOUNT
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # تنزيل الـ NDK من Google يفشل أحياناً، فنستخدم أحدث نسخة منصبة على السيرفر.
      - name: Use preinstalled Android NDK
        run: |
          ls "$ANDROID_HOME/ndk"
          echo "ANDROID_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"
      # يوقع بالمفتاح الثابت إذا الـ Secrets موجودة، حتى التحديثات تنصب فوق النسخة القديمة
      # ودخول كوكل يعرف التطبيق.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD not set; signing with a debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
      # رابط السيرفر: https://lacasa-store.<subdomain>.workers.dev من حساب Cloudflare.
      - name: Find server URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../.github/scripts/notify-url.sh >> "$GITHUB_ENV"
      - name: Build APK
        run: flutter build apk --release --dart-define=NOTIFY_URL="$NOTIFY_URL"
      - name: Show APK signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA-1|SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: lacasa-store-apk
          path: store_app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Find server URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../.github/scripts/notify-url.sh >> "$GITHUB_ENV"
      # بناء بدون توقيع للتأكد إنه يشتغل. للنشر على App Store يحتاج حساب Apple Developer.
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --dart-define=NOTIFY_URL="$NOTIFY_URL"
      # ملف IPA بدون توقيع، حتى يتوقع ببرنامج مثل Sideloadly أو ESign وينصب للتجربة.
      - name: Package unsigned IPA
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry lacasa-store-unsigned.ipa Payload
          ls -lh lacasa-store-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: lacasa-store-ios-unsigned
          path: store_app/build/ipa/lacasa-store-unsigned.ipa

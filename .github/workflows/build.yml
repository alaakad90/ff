name: Build store app

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: store_app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          --dart-define=CHAT_ID=${{ secrets.CHAT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: lacasa-store-apk
          path: store_app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # بناء بدون توقيع للتأكد إنه يشتغل. للنشر على App Store يحتاج حساب Apple Developer.
      - name: Build iOS (no codesign)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          --dart-define=CHAT_ID=${{ secrets.CHAT_ID }}

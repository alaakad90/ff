# سيرفر متجر لاكاسا على Cloudflare Workers.
# ينشر أوتوماتيكياً من GitHub Actions (.github/workflows/build.yml) لما يتدمج شي بـ master.
# الأسرار (BOT_TOKEN، CHAT_ID، FIREBASE_SERVICE_ACCOUNT) تنحط من GitHub Secrets وقت النشر.
name = "lacasa-store"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

# الدومين الخاص بالمتجر (مسجّل بـ GoDaddy، والـ DNS مالته على Cloudflare).
# Cloudflare يسوي سجلات الـ DNS وشهادة HTTPS بنفسه وقت النشر.
routes = [
  { pattern = "lacasastores.com", custom_domain = true },
  { pattern = "www.lacasastores.com", custom_domain = true },
]

# المتجر بالمتصفح: نسخة الويب من التطبيق (Flutter web) تنبني بـ GitHub Actions وتنحط بـ public/.
# روابط السيرفر تروح للكود أول؛ وأي رابط ثاني يفتح صفحة المتجر.
[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/notify-order", "/notify-status", "/privacy", "/support"]
